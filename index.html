  <title>stkr</title>
  <style>
    #loader {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: hsl(0deg 0% 0%);
      z-index: 9999;
      animation: fadeIn 0.6s ease-in-out;
    }

    #loader-content {
      text-align: center;
      color: hsl(0deg 0% 100%);
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
      }

      to {
        opacity: 1;
      }
    }
  </style>
</head>

<body>
  <div id="loader">
    <div id="loader-content">
      <svg width="150" height="150" viewBox="0 0 150 150" fill="none" xmlns="http://www.w3.org/2000/svg">
        <rect width="150" height="31.5" fill="white" style="fill:white;fill-opacity:1;" />
        <rect y="39.5" width="150" height="31.5" fill="white" style="fill:white;fill-opacity:1;" />
        <rect y="79" width="150" height="31.5" fill="white" style="fill:white;fill-opacity:1;" />
        <rect y="118.5" width="150" height="31.5" fill="white" style="fill:white;fill-opacity:1;" />
      </svg>

    </div>
  </div>
  <div id="root"></div>

</body>
